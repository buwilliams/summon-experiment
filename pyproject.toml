[project]
name = "summon"
version = "0.1.0"
description = "Summon experiment: compare prompting styles with a Jev preference judge"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "httpx",
    "pyyaml",
    "python-dotenv",
]

[project.scripts]
summon = "summon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summon"]
